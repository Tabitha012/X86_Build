name: X86 云编译 (ImmortalWrt 24.10)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: 初始化编译环境（激进清理磁盘 + Rust）
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android 2>/dev/null
          sudo rm -rf /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/local/lib/node_modules 2>/dev/null
          sudo -E apt-get -y update
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y install $(curl -fsSL https://raw.githubusercontent.com/P3TERX/Actions-OpenWrt/main/depends-ubuntu-2204)
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo docker system prune -af 2>/dev/null || true
          df -h /
          sudo timedatectl set-timezone "${TZ}"

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          source $HOME/.cargo/env
          rustc --version
          cargo --version

      - name: 拉取官方源码
        run: |
          git clone -q --single-branch --depth=1 --branch=${REPO_BRANCH} ${REPO_URL} openwrt

      - name: 运行 diy2 自定义脚本
        run: |
          cd openwrt
          if [ -f ../scripts/diy2.sh ]; then
            chmod +x ../scripts/diy2.sh
            bash ../scripts/diy2.sh
          else
            echo "未找到 diy2.sh，跳过"
          fi

      - name: 加载 .config
        run: |
          if [ -e .config ]; then
            cp .config openwrt/.config
            echo ".config 已加载"
          else
            echo "未找到 .config，使用默认配置"
          fi

      - name: 集成自定义 files 文件夹
        run: |
          if [ -d "files" ]; then
            cp -a files openwrt/files
            echo "自定义 files 文件夹已注入"
          else
            echo "未检测到 files 文件夹"
          fi

      - name: 下载依赖包
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      # ==========================================
      # 编译步骤（保存日志到 build.log）
      # ==========================================
      - name: 编译固件（线程拉满）
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log
          MAKE_RESULT=${PIPESTATUS[0]}
          if [ $MAKE_RESULT -eq 0 ]; then
            echo "status=success" >> ${GITHUB_OUTPUT}
          else
            exit $MAKE_RESULT
          fi

      # ==========================================
      # 报错汇总层（编译失败时独立展示所有报错）
      # ==========================================
      - name: 📋 报错汇总（编译失败时查看）
        if: failure()
        run: |
          cd openwrt
          echo "=========================================="
          echo "         编译报错汇总"
          echo "=========================================="
          grep -E "Error|error|failed|make: \*\*\*" build.log 2>/dev/null || echo "未抓到标准错误行"
          echo "=========================================="
          echo "    以上为本次编译的所有报错行"
          echo "=========================================="

      # ==========================================
      # 编译失败 -> Bark 通知（仅通知，不推送详情）
      # ==========================================
      - name: 编译失败 -> Bark 通知
        if: failure()
        run: |
          curl -G "https://api.day.app/genMFkPnbNuNTFRKNxwyze" \
            --data-urlencode "title=❌ X86 云编译失败" \
            --data-urlencode "body=仓库: ${{ github.repository }}\n分支: ${{ github.ref_name }}\n耗时: ${{ github.run_duration }}\n请查看 Actions 日志中的「报错汇总」层定位问题" \
            --data-urlencode "sound=alarm" \
            --data-urlencode "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ==========================================
      # 整理固件（只保留 img + iso）
      # ==========================================
      - name: 整理固件（只保留 img + iso）
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/x86/64
          rm -rf packages
          find . -type f ! \( -name "*.img.gz" -o -name "*.iso" -o -name "*.img" \) -delete 2>/dev/null || true
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: 上传固件
        uses: actions/upload-artifact@main
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: ImmortalWrt_x86_Firmware
          path: ${{ env.FIRMWARE }}

      - name: 编译成功 -> Bark 通知
        if: steps.organize.outputs.status == 'success' && !cancelled()
        run: |
          curl -G "https://api.day.app/genMFkPnbNuNTFRKNxwyze" \
            --data-urlencode "title=✅ X86 云编译成功" \
            --data-urlencode "body=仓库: ${{ github.repository }}\n分支: ${{ github.ref_name }}\n耗时: ${{ github.run_duration }}\n固件已上传至 Artifacts" \
            --data-urlencode "sound=glass" \
            --data-urlencode "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
