name: X86 增加跳过逻辑+Bark推送24.10

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout
        uses: actions/checkout@main

      # --------------------------------------------
      # 环境初始化 + 磁盘清理
      # --------------------------------------------
      - name: 初始化编译环境（激进清理磁盘）
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android 2>/dev/null
          sudo rm -rf /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/local/lib/node_modules 2>/dev/null
          sudo -E apt-get -y update
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y install $(curl -fsSL https://raw.githubusercontent.com/P3TERX/Actions-OpenWrt/main/depends-ubuntu-2204)
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo docker system prune -af 2>/dev/null || true
          df -h /
          sudo timedatectl set-timezone "${TZ}"

      - name: 拉取官方源码
        run: |
          git clone -q --single-branch --depth=1 --branch=${REPO_BRANCH} ${REPO_URL} openwrt

      - name: 运行 diy2 自定义脚本（添加第三方源 + LAN IP 修改）
        run: |
          cd openwrt
          if [ -f ../scripts/diy2.sh ]; then
            chmod +x ../scripts/diy2.sh
            bash ../scripts/diy2.sh
          else
            echo "未找到 diy2.sh，跳过"
          fi

      - name: 加载 .config
        run: |
          if [ -e .config ]; then
            cp .config openwrt/.config
            echo ".config 已加载"
          else
            echo "未找到 .config，使用默认配置"
          fi

      - name: 集成自定义 files 文件夹
        run: |
          if [ -d "files" ]; then
            cp -a files openwrt/files
            echo "自定义 files 文件夹已注入"
          else
            echo "未检测到 files 文件夹"
          fi

      - name: 下载依赖包
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      # --------------------------------------------
      # 编译步骤（-k 参数：遇到失败继续编译）
      # --------------------------------------------
      - name: 编译固件（遇到失败跳过，继续编译）
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile (keep-going mode)"
          set -o pipefail
          make -j$(nproc) V=s -k 2>&1 | tee build.log
          MAKE_RESULT=${PIPESTATUS[0]}
          echo "make 退出码: $MAKE_RESULT"
          if [ $MAKE_RESULT -eq 0 ]; then
            echo "status=success" >> ${GITHUB_OUTPUT}
          else
            echo "status=partial" >> ${GITHUB_OUTPUT}
          fi

      # --------------------------------------------
      # 无论是否完全成功，只要固件目录存在就整理
      # --------------------------------------------
      - name: 整理固件（只保留 img + iso）
        id: organize
        if: (steps.compile.outputs.status == 'success' || steps.compile.outputs.status == 'partial') && !cancelled()
        run: |
          cd openwrt/bin/targets/x86/64 2>/dev/null || (echo "固件目录不存在，编译可能完全失败" && exit 1)
          rm -rf packages
          find . -type f ! \( -name "*.img.gz" -o -name "*.iso" -o -name "*.img" \) -delete 2>/dev/null || true
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: 上传固件
        uses: actions/upload-artifact@main
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: ImmortalWrt_x86_Firmware
          path: ${{ env.FIRMWARE }}

      # --------------------------------------------
      # 编译失败（完全失败）-> 抓取报错 + Bark 推送
      # --------------------------------------------
      - name: 编译失败 -> 抓取错误并推送 Bark
        if: failure()
        run: |
          cd openwrt
          ERROR_MSG=$(grep -i "error\|failed\|make: \*\*\*" build.log 2>/dev/null | tail -3 | tr '\n' ' ' | cut -c1-200)
          if [ -z "$ERROR_MSG" ]; then
            ERROR_MSG="编译中断，未知错误，请检查日志。"
          fi
          curl -G "https://api.day.app/genMFkPnbNuNTFRKNxwyze" \
            --data-urlencode "title=❌ X86 云编译失败" \
            --data-urlencode "body=仓库: ${{ github.repository }}\n分支: ${{ github.ref_name }}\n报错摘要: ${ERROR_MSG}\n详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --data-urlencode "sound=alarm" \
            --data-urlencode "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # --------------------------------------------
      # 部分成功（有固件但可能缺插件）-> Bark 推送
      # --------------------------------------------
      - name: 部分成功 -> Bark 推送
        if: steps.organize.outputs.status == 'success' && !cancelled() && steps.compile.outputs.status == 'partial'
        run: |
          curl -G "https://api.day.app/genMFkPnbNuNTFRKNxwyze" \
            --data-urlencode "title=⚠️ X86 编译部分成功" \
            --data-urlencode "body=仓库: ${{ github.repository }}\n分支: ${{ github.ref_name }}\n耗时: ${{ github.run_duration }}\n部分插件可能编译失败被跳过\n固件已上传至 Artifacts" \
            --data-urlencode "sound=glass" \
            --data-urlencode "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # --------------------------------------------
      # 完全成功 -> Bark 推送
      # --------------------------------------------
      - name: 完全成功 -> Bark 推送
        if: steps.organize.outputs.status == 'success' && !cancelled() && steps.compile.outputs.status == 'success'
        run: |
          curl -G "https://api.day.app/genMFkPnbNuNTFRKNxwyze" \
            --data-urlencode "title=✅ X86 云编译完全成功" \
            --data-urlencode "body=仓库: ${{ github.repository }}\n分支: ${{ github.ref_name }}\n耗时: ${{ github.run_duration }}\n所有插件编译通过\n固件已上传至 Artifacts" \
            --data-urlencode "sound=glass" \
            --data-urlencode "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
